services:
  app:
    environment:
      QA_AUTH_COOKIE_SECURE: "1"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env.docker}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-20m}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ${TLS_CERT_DIR:-./docker-data/certs}:/etc/nginx/certs:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
